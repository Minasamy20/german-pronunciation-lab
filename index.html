<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>German Pronunciation Lab V3</title><style>body{font-family:-apple-system,system-ui,sans-serif;background:#f3f5fa;color:#17233b;max-width:680px;margin:auto;padding:18px}h1{font-size:25px}.card{background:white;border-radius:16px;padding:17px;margin:12px 0;box-shadow:0 2px 10px #17233b0b}label{font-size:13px;color:#536078;display:block;margin:8px 0}select,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #dce0e9}select{width:100%;background:white}button{background:#344eb3;color:white;border:0;min-height:46px;cursor:pointer}button.alt{background:#e9eeff;color:#2c449b}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}.de{font-size:22px;font-weight:700;direction:ltr;text-align:left}.ar{color:#647086;margin:8px 0 13px}.buttons{display:flex;gap:8px}.buttons button{flex:1}.muted{color:#5d687e;font-size:13px;line-height:1.8}.hide .de{filter:blur(9px)}#status{font-size:13px;color:#405795;min-height:22px}</style></head><body><h1>🇩🇪 معمل النطق — V3</h1><p class="muted">اختبار سرعة النطق والأصوات المتاحة فعليًا في Safari</p><section class="card"><label>الصوت الألماني المتاح للمتصفح</label><select id="voices"></select><button class="alt" id="refresh" style="margin-top:8px">🔄 إعادة فحص الأصوات</button><div class="controls"><div><label>السرعة الأساسية</label><select id="rate"><option value="1">عادية 1.0×</option><option value="0.7">بطيئة 0.7×</option><option value="0.45">بطيئة جدًا 0.45×</option></select></div><div><label>التكرار</label><select id="repeat"><option value="1">مرة واحدة</option><option value="3">3 مرات</option></select></div></div><p id="status" aria-live="polite"></p><button class="alt" id="hide" style="width:100%">🙈 إخفاء النص الألماني</button></section><main id="items"></main><section class="card muted">مهم: زر «بطيء جدًا» يستخدم سرعة 0.35× مستقلة عن القائمة. بعض إصدارات Safari قد تقلل تأثير السرعات. أصوات Siri المحمية مش متاحة عادةً لصفحات الويب؛ القائمة بتعرض فقط اللي المتصفح يسمح بيه.</section><script>
const lines=[['Hallo!','أهلًا'],['Guten Morgen!','صباح الخير'],['Wie heißen Sie?','حضرتك اسمك إيه؟'],['Ich komme aus Ägypten.','أنا من مصر'],['Ich wohne in Kuwait.','أنا ساكن في الكويت'],['Freut mich!','تشرفت بمعرفتك']];const synth=window.speechSynthesis,voiceEl=document.getElementById('voices'),statusEl=document.getElementById('status');let voices=[],token=0;
function load(){voices=synth.getVoices().filter(v=>v.lang.toLowerCase().startsWith('de'));let previous=voiceEl.value;voiceEl.innerHTML='';if(!voices.length){voiceEl.add(new Option('لم يظهر صوت ألماني — سيتم استخدام الصوت الافتراضي',''));}else voices.forEach(v=>voiceEl.add(new Option(v.name+' — '+v.lang+(v.localService?' (على الجهاز)':''),v.voiceURI)));if(voices.some(v=>v.voiceURI===previous))voiceEl.value=previous;statusEl.textContent='الأصوات الألمانية الظاهرة: '+voices.length+'.';}
function speak(t,rate){const my=++token;synth.cancel();let n=0;const total=Number(document.getElementById('repeat').value);function next(){if(my!==token||n>=total){if(my===token)statusEl.textContent='انتهى التشغيل';return;}n++;let u=new SpeechSynthesisUtterance(t);u.lang='de-DE';u.rate=rate;u.pitch=1;let v=voices.find(v=>v.voiceURI===voiceEl.value);if(v)u.voice=v;u.onend=()=>{if(my===token)setTimeout(next,450)};u.onerror=e=>{if(my===token)statusEl.textContent='تعذر تشغيل الصوت: '+e.error};statusEl.textContent='تشغيل '+n+' من '+total+' — سرعة '+rate+'×';synth.speak(u);}next();}
document.getElementById('items').innerHTML=lines.map((l,i)=>`<section class="card"><div class="de" lang="de">${l[0]}</div><div class="ar">${l[1]}</div><div class="buttons"><button data-i="${i}" data-slow="0">🔊 استمع</button><button class="alt" data-i="${i}" data-slow="1">🐢 بطيء جدًا</button></div></section>`).join('');document.getElementById('items').addEventListener('click',e=>{let b=e.target.closest('button[data-i]');if(!b)return;speak(lines[Number(b.dataset.i)][0],b.dataset.slow==='1'?0.35:Number(document.getElementById('rate').value));});document.getElementById('hide').onclick=()=>document.getElementById('items').classList.toggle('hide');document.getElementById('refresh').onclick=load;synth.onvoiceschanged=load;load();setTimeout(load,500);setTimeout(load,1800);
</script></body></html>
